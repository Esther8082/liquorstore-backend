
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MAL INN EATING HOUSE</title>

    <link rel="stylesheet" href="css/products.css">
</head>

<body>

    <!-- =====================================================
         TOP BAR
    ====================================================== -->

    <header class="topbar">

        <button
            id="menu-btn"
            class="menu-btn"
            type="button"
        >
            ☰
        </button>

        <div class="brand">
            <span>MAL INN EATING HOUSE</span>
        </div>

    </header>


    <!-- =====================================================
         MAIN PRODUCTS LAYOUT
    ====================================================== -->

    <div class="products-layout">


        <!-- =================================================
             HAMBURGER SIDE PANEL
        ================================================== -->

        <aside
            id="sidebar"
            class="sidebar"
        >

            <h2>Menu</h2>


            <ul class="sidebar-menu">

                <!-- POS / PRODUCTS -->
                <li>
                    <a
                        href="index.html"
                        class="home-btn"
                    >
                        POS
                    </a>
                </li>


                <!-- INVENTORY -->
                <li>
                    <a href="inventory.html">
                        Inventory
                    </a>
                </li>


                <!-- CUSTOMERS -->
                <li>
                    <a href="customers.html">
                        Customers
                    </a>
                </li>


                <!-- STOCK MANAGEMENT -->
                <li class="dropdown">

                    <div
                        class="dropdown-btn"
                        id="stock-btn"
                    >

                        <span>
                            Stock Management
                        </span>

                        <span class="arrow">
                            ▼
                        </span>

                    </div>


                    <ul
                        class="submenu"
                        id="stock-menu"
                    >

                        <li>
                            <a href="stockmanagement/addproduct.html">
                                Add Product
                            </a>
                        </li>


                        <li>
                            <a href="stockmanagement/stockadjustments.html">
                                Stock Adjustments
                            </a>
                        </li>


                        <li>
                            <a href="stockmanagement/lowinstock.html">
                                Low In Stock
                            </a>
                        </li>

                    </ul>

                </li>


                <!-- REPORTS -->
                <li>
                    <a href="reports.html">
                     Reports
                    </a>
                </li>


                <!-- SETTINGS -->
                <li>
                    <a href="settings.html">
                         Settings
                    </a>
                </li>

            </ul>

        </aside>


        <!-- =================================================
             MAIN CONTENT
        ================================================== -->

        <main
            id="main-content"
            class="main-content"
        >


            <!-- =============================================
                 SEARCH
            ============================================== -->

            <div class="top-bar">

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search product or barcode..."
                    autocomplete="off"
                >

            </div>


            <!-- =============================================
                 PRODUCT CATEGORIES
            ============================================== -->

            <div
                id="categoryBar"
                class="category-bar"
            >

                <button
                    type="button"
                    class="category-btn active"
                    data-category="ALL"
                >
                    All Products
                </button>

                <!--
                    JavaScript will add the remaining
                    categories here.
                -->

            </div>


            <!-- =============================================
                 PRODUCTS
            ============================================== -->

            <div
                id="productsGrid"
                class="products-grid"
            ></div>


        </main>


        <!-- =================================================
             CART RESIZER
        ================================================== -->

       <!-- CART TOGGLE BUTTON -->
<button
    id="cart-toggle-btn"
    class="cart-toggle-btn"
    type="button"
    aria-label="Hide cart"
    aria-expanded="true"
    title="Hide cart"
>
    &gt;
</button>

<!-- CART RESIZER -->
<div
    id="cart-resizer"
    class="cart-resizer"
></div>


        <!-- =================================================
             CART
        ================================================== -->

        <aside
            id="cart"
            class="cart-panel"
        >


            <!-- CART HEADER -->

            <div
                id="cart-header"
                class="cart-header"
            >

                <div>

                    <h3>
                        Current Sale
                    </h3>

                    <span class="cart-subtitle">
                        Items selected for checkout
                    </span>

                </div>


                <button
                    id="clear-cart-btn"
                    class="clear-cart-btn"
                    type="button"
                >
                    Clear
                </button>

            </div>


            <!-- CART CONTENT -->

            <div class="cart-content">

                <div class="cart-table-wrapper">

                    <table class="cart-table">

                        <thead>

                            <tr>

                                <th>
                                    Item
                                </th>

                                <th>
                                    Qty
                                </th>

                                <th>
                                    Total
                                </th>

                            </tr>

                        </thead>


                        <tbody id="cart-body">

                        </tbody>

                    </table>

                </div>

            </div>


            <!-- CART FOOTER -->

           <div class="cart-footer">

    <div class="cart-total">
        <span>Total</span>
        <strong id="cart-total">R 0.00</strong>
    </div>

    <button id="checkout-btn" class="checkout-btn" type="button">
        Checkout
    </button>

</div>

        </aside>

    </div>


    <!-- =====================================================
         PRODUCTS JAVASCRIPT
    ====================================================== -->

    <script
        type="module"
        src="js/pages/products.js"
    ></script>

</body>

</html>
