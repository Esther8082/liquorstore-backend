<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Inventory</title>

    <link rel="stylesheet" href="./css/inventory.css">
</head>

<body>

    <!-- TOP BAR -->
    <header class="topbar">

        <button id="menu-btn">☰</button>

        <div class="brand">
            <span>Inventory</span>
        </div>

    </header>

    <div class="inventory-container">

        <!-- SIDEBAR -->
        <aside class="sidebar" id="sidebar">

            <h2>Inventory</h2>

            <ul class="sidebar-menu">

                <li>
                    <a href="index.html" class="home-btn">
                        🏠 Home
                    </a>
                </li>

            </ul>

            <ul id="category-list"></ul>

        </aside>

        <!-- MAIN -->
        <main class="main-content">

            <!-- SEARCH -->
            <div class="top-bar">

                <div class="search-box">

                    <span class="search-icon">🔍</span>

                    <input
                        type="text"
                        id="inventory-search"
                        placeholder="Search product, barcode or category..."
                    >

                </div>

                <button
                    id="closeInventoryBtn"
                    class="close-btn"
                >
                    Close
                </button>

            </div>

            <!-- INVENTORY CARDS -->
            <div
                id="inventory-grid"
                class="inventory-grid"
            ></div>

        </main>

    </div>

    <script src="./js/pages/inventory.js"></script>

</body>

</html>
